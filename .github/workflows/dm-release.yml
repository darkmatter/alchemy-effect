name: dm-release

# Publishes @darkmatter/alchemy to GitHub Packages when a dm/v* tag is
# pushed (e.g. dm/v2.0.0-beta.61.dm1). The tag must match the version in
# packages/alchemy/package.json — the workflow fails otherwise so tags,
# package versions, and consumer pins can never drift apart.

on:
  push:
    tags:
      - "dm/v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: dm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The bun workspace includes `distilled/packages/*` from the
          # distilled submodule.
          submodules: "true"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure GitHub Packages auth
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@darkmatter:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./packages/alchemy/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#dm/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag dm/v$TAG_VERSION does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Build
        working-directory: packages/alchemy
        # The alchemy package ships the repo-root README.md; copy it in
        # before the build so packing picks it up (same trick as the
        # upstream release workflow).
        run: |
          cp ../../README.md . 2>/dev/null || true
          bun run build

      - name: Rebrand package for publish
        working-directory: packages/alchemy
        # The workspace keeps the name `alchemy` so sibling packages'
        # `alchemy@workspace:*` deps resolve; only the published artifact
        # carries the org scope.
        run: |
          bun -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='@darkmatter/alchemy';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Publish to GitHub Packages
        working-directory: packages/alchemy
        # bun pm pack substitutes `workspace:*` and `catalog:` protocol
        # refs with concrete versions (the substituted @distilled.cloud/*
        # versions exist on public npm); npm then publishes the finished
        # tarball using the ~/.npmrc auth — bun publish does not reliably
        # pick up npmrc/bunfig credentials for scoped registries.
        run: |
          bun pm pack --destination /tmp/dm-pack
          npm publish /tmp/dm-pack/*.tgz
